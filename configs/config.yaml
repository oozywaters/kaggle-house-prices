seed: 42
data_dir: data
submission_path: submissions/${model}_submission.csv

cv:
  n_folds: 5

model: mlp

params:
  linreg: {}
  ridge:
    alpha: 10.0
  lasso:
    alpha: 0.001
    max_iter: 5000
  elasticnet:
    alpha: 0.001
    l1_ratio: 0.5
    max_iter: 5000
  knn:
    n_neighbors: 5
  decision_tree:
    max_depth: 5
    random_state: 42
  random_forest:
    n_estimators: 300
    random_state: 42
  catboost:
    iterations: 1000
    learning_rate: 0.03
    verbose: 0
    allow_writing_files: false
    random_state: 42
  lightgbm:
    n_estimators: 500
    learning_rate: 0.05
    verbose: -1
    random_state: 42
  xgboost:
    n_estimators: 500
    learning_rate: 0.05
    random_state: 42
  mlp:
    hidden_sizes: [256, 128]
    activation: relu
    batchnorm: true
    dropout: 0.2
    optimizer: adamw
    lr: 0.001
    weight_decay: 0.0001
    batch_size: 64
    n_epochs: 100
    scheduler: cosine
    seed: 42
